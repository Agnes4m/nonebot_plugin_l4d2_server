<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig 配置（给 nonebot-plugin-htmlkit / litehtml 出图用）。

  为什么需要它：
    没有 fonts.conf 时 fontconfig 缺少通用字族（sans-serif / serif / monospace）
    的映射规则，litehtml 只能逐字回退字体 —— 同一行里的汉字、西文、数字来自
    不同字体，x-height / 字重 / 基线全对不上（看着「东倒西歪」）。

  怎么生效：
    插件在 import 时（早于 htmlkit 的 driver.on_startup）把 FONTCONFIG_FILE
    指向本文件，所以 Windows / Linux 都不需要额外的 .env 配置。
    如果你自己设了 FONTCONFIG_FILE，以你的为准（htmlkit 启动时会覆盖回来）。

  注意：
    - 目录用「多平台一起列」的写法，fontconfig 会跳过不存在的目录。
    - Linux 上要真正显示中文，系统必须装了 CJK 字体（见 prefer 列表），
      例如 Debian/Ubuntu 的 fonts-noto-cjk 或 fonts-wqy-microhei。
-->
<fontconfig>
  <!-- 字体目录：Linux 与 Windows 都列上，不存在的会被跳过 -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir>C:/Windows/Fonts</dir>
  <dir>C:/Windows/Fonts/ttf</dir>

  <!--
    字体缓存目录：只用 ~/.cache/fontconfig。
    不要加 /var/cache/fontconfig —— Windows 上 fontconfig 会把它解析成
    <当前盘符>:/var/cache/fontconfig，在盘根乱建目录。
  -->
  <cachedir>~/.cache/fontconfig</cachedir>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <!--
    通用字族映射：让汉字、西文、数字同出一套字形。
    每种字族都把「带完整 CJK 覆盖」的字体排在前面，Linux 上按可用性依次命中；
    Windows 上第一个 Microsoft YaHei 就命中，后面的不会被用到。
  -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Microsoft YaHei</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans SC</family>
      <family>Source Han Sans SC</family>
      <family>WenQuanYi Micro Hei</family>
      <family>Segoe UI</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Microsoft YaHei</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif SC</family>
      <family>Source Han Serif SC</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Consolas</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>DejaVu Sans Mono</family>
      <family>Microsoft YaHei</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Microsoft YaHei</family>
      <family>Noto Sans CJK SC</family>
      <family>Segoe UI</family>
    </prefer>
  </alias>
</fontconfig>
